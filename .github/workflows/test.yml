# Kjører testene ved hver push og pull request. Render deployer bare når de har gått gjennom
# (autoDeployTrigger: checksPass i render.yaml, eller «After CI Checks Pass» i Render).
name: Tester
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Sjekk sårbarheter i avhengighetene
        run: npm audit --omit=dev --audit-level=high
